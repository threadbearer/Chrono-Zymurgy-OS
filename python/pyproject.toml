[project]
name = "chrono-zymurgy-engine"
version = "1.0.0"
description = "Continuous-Time Biophysics ODE Solver & Recipe Optimizer for CHRONO-ZYMURGY OS"
authors = [{ name = "Jacob Legorreta" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

